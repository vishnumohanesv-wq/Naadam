<style>
:root{--bg:#0a0714;--s1:#16211c;--s2:#1d2c26;--line:#2c4a40;--tx:#f6f0df;--mu:#9bb5a6;--gold:#ff7a59;--palm:#5fd3a0;--rose:#e8665a;--on:#1a1405;--grad:linear-gradient(135deg,#ff5f7e,#ff9a3c);--glass:rgba(8,26,18,.82);--hf:"Playfair Display","Noto Sans Malayalam","Noto Sans Tamil","Noto Sans Kannada","Noto Sans Telugu","Noto Sans Devanagari",serif}
[data-theme=light]{--bg:#f6f3ff;--s1:#faf5ea;--s2:#f2e9d0;--line:#e2d6b5;--tx:#13281d;--mu:#5d7466;--gold:#8a6a2e;--palm:#0e7a56;--rose:#d4473b;--glass:rgba(251,246,233,.88)}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--tx);font-family:Inter,"Noto Sans Malayalam","Noto Sans Tamil","Noto Sans Kannada","Noto Sans Telugu","Noto Sans Devanagari",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;scroll-behavior:smooth}
h1,h2,h3,.hd{font-family:var(--hf)}
body{padding-bottom:calc(150px + env(safe-area-inset-bottom));overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 400px at 10% -5%,rgba(255,122,89,.14),transparent),radial-gradient(500px 400px at 100% 30%,rgba(31,107,74,.25),transparent),radial-gradient(500px 400px at 0% 100%,rgba(95,211,160,.08),transparent)}
.mu{color:var(--mu)}.gold{color:var(--gold)}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5)}
header.top{border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top)}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:repeating-linear-gradient(90deg,var(--gold) 0 14px,transparent 14px 20px);opacity:.7}
.ib{width:44px;height:44px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--s1);color:var(--tx);transition:transform .12s}
.ib:active,.btn:active,.row:active,.tile:active{transform:scale(.96)}
.btn{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 18px;border-radius:14px;font-weight:600;background:var(--grad);color:var(--on);transition:transform .12s}
.btn.ghost{background:var(--s1);color:var(--tx);border:1px solid var(--line)}
.btn.danger{background:rgba(255,93,115,.14);color:var(--rose);border:1px solid rgba(255,93,115,.4)}
.inp{width:100%;height:50px;border-radius:14px;padding:0 16px;background:var(--s1);border:1px solid var(--line);color:var(--tx);font-size:16px}
.pill{flex:none;height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--s1);font-size:14px;font-weight:500}
.pill.active{background:var(--grad);color:var(--on);border-color:transparent}
.hs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}.hs::-webkit-scrollbar{display:none}
.hs>*{scroll-snap-align:start}
.sec{font-family:var(--hf);font-weight:700;font-size:18px;margin:26px 0 12px;display:flex;justify-content:space-between;align-items:center}
.sec button{font-size:13px;font-weight:500;color:var(--gold)}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px;background:linear-gradient(135deg,#2a1260,#3b1a8a 55%,#5b21b6);color:#fff;min-height:180px;display:flex;justify-content:space-between;gap:14px;box-shadow:0 20px 50px -20px rgba(11,61,43,.7)}
.hero .ring{position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;border:2px solid rgba(255,154,60,.35);box-shadow:0 0 0 22px rgba(255,154,60,.07),0 0 0 48px rgba(255,154,60,.05);animation:pulse 5s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.tile{flex:none;width:132px;text-align:left}
.tile .art{width:132px;height:132px;border-radius:20px}
.art{overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:2rem;background:var(--s2);flex:none}
.art img{width:100%;height:100%;object-fit:cover}
.mood{flex:none;width:150px;height:88px;border-radius:20px;padding:14px;text-align:left;font-family:var(--hf);font-weight:700;color:#fff;position:relative;overflow:hidden}
.mood span{position:absolute;right:8px;bottom:-4px;font-size:44px;opacity:.5}
.row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:18px;background:var(--s1);border:1px solid var(--line);transition:border-color .2s,transform .12s,box-shadow .2s;animation:rise .4s both;animation-delay:calc(var(--i,0)*30ms)}
.row.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 10px 30px -12px rgba(255,154,60,.5)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.row .art{width:56px;height:56px;border-radius:14px}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:14px}
.eq i{width:3px;background:var(--palm);border-radius:2px;height:25%;animation:eq 1s ease-in-out infinite;animation-play-state:paused}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.2s}.eq i:nth-child(4){animation-delay:-.7s}
.playing .eq i{animation-play-state:running}
@keyframes eq{50%{height:100%}}
.skel{height:72px;border-radius:18px;background:linear-gradient(90deg,var(--s1),var(--s2),var(--s1));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
/* nav + mini player */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom div{display:grid;grid-template-columns:repeat(5,1fr);max-width:640px;margin:auto}
nav.bottom button{height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--mu)}
nav.bottom button.active{color:var(--gold)}
#mini{position:fixed;left:10px;right:10px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:41;border-radius:22px;border:1px solid var(--line);box-shadow:0 14px 40px -10px rgba(0,0,0,.6);max-width:640px;margin:auto;overflow:hidden}
#mini .prog{height:3px;background:var(--line)}#bar{height:100%;width:0;background:var(--grad)}
.pbtn{width:54px;height:54px;border-radius:50%;background:var(--grad);color:var(--on);display:flex;align-items:center;justify-content:center;flex:none}
.spin{width:22px;height:22px;border:3px solid rgba(0,0,0,.2);border-top-color:var(--on);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:var(--line);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--gold)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:var(--gold)}
button,a{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* sheet */
#sheet{position:fixed;inset:0;z-index:55;background:radial-gradient(circle at 50% 18%,#2a1260 0,#150b33 45%,#0a0714 80%);color:#eef1f8;transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.8,.2,1);overflow-y:auto;padding:env(safe-area-inset-top) 20px calc(24px + env(safe-area-inset-bottom))}
#sheet.open{transform:none}
#sheet .ib{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#fff}
.stage{perspective:900px;display:flex;justify-content:center;padding:14px 0 4px}
.tilt{transform:rotateX(24deg);transform-style:preserve-3d;transition:transform .6s}
.disc{width:min(68vw,280px);aspect-ratio:1;border-radius:50%;position:relative;background:repeating-radial-gradient(circle,#0b0b0b 0 2px,#1b1b1b 3px 4px);box-shadow:0 30px 50px rgba(0,0,0,.7),0 0 70px rgba(255,154,60,.28);animation:sp 7s linear infinite;animation-play-state:paused}
.disc::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 30deg,transparent 0 20%,rgba(255,255,255,.15) 25%,transparent 32% 70%,rgba(255,255,255,.12) 76%,transparent 82%)}
.sp .disc{animation-play-state:running}.sp .tilt{transform:rotateX(14deg) translateZ(30px)}
.label{position:absolute;inset:30%;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:2.2rem;background:var(--grad)}
.label::after{content:"";position:absolute;width:12%;height:12%;border-radius:50%;background:#0a0714}
.label img{width:100%;height:100%;object-fit:cover}
#modal,#menu{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center}
#modal.show,#menu.show{display:flex}
.sheetbox{width:100%;max-width:460px;border-radius:26px 26px 0 0;background:var(--s1);padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));border:1px solid var(--line)}
@media(min-width:640px){#modal,#menu{align-items:center}.sheetbox{border-radius:26px}}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;padding:12px 18px;border-radius:14px;background:var(--s2);border:1px solid var(--gold);font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
@media(prefers-reduced-motion:reduce){.row,.hero .ring,.disc,.eq i,.skel{animation:none}}
nav.bottom button.active::after{content:"";width:18px;height:3px;border-radius:2px;background:var(--gold)}
nav.bottom button.navmic{width:56px;height:56px;border-radius:50%;margin:-12px auto 0;background:var(--grad);color:var(--on);box-shadow:0 8px 22px -6px rgba(255,122,89,.7),0 0 0 4px var(--bg)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(90deg,#ff7a59 0 10px,#ff9a3c 10px 14px,#ff7a59 14px 24px)}
.row{background:linear-gradient(160deg,var(--s1),var(--s2))}
.tile{animation:rise .5s both}.tile .art,.row .art{box-shadow:0 8px 20px -8px rgba(0,0,0,.6);border:1px solid rgba(255,122,89,.28)}
#va{position:fixed;inset:0;z-index:75;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:radial-gradient(circle at 50% 35%,#4c1d95 0,#1e1040 50%,#0a0714 85%);color:#f6f0df}
#va.show{display:flex}
.orb{position:relative;width:132px;height:132px;border-radius:50%;background:linear-gradient(135deg,#ff5f7e,#ff9a3c);color:#1a1405;display:flex;align-items:center;justify-content:center;box-shadow:0 0 60px rgba(255,122,89,.35)}

async function run(raw){const x=raw.trim();if(!x)return;$('vaHear').textContent=x;const nm=x.match(/\d+/),ln=LN.find(l=>l[1].test(x)),lc=ln&&ln[0];
 if(/\bfocus\b|pomodoro|work mode|ഫോക്കസ്|ஃபோகஸ்|ಫೋಕಸ್|ఫోకస్|फोकस|फ़ोकस/i.test(x)){const NA=window.NAADAM;if(!NA)return say(t('dunno'));if(K.off.test(x)||K.stop.test(x)){NA.focusStop();return say(t('ok'))}NA.focusStart(nm?+nm[0]:25);return say(t('ok'))}

 if(K.mute.test(x)){muted=!/un/i.test(x);applyVol();return say(t('ok'))}
 if(K.vol.test(x)){if(nm)vol=+nm[0];else if(K.up.test(x))vol+=15;else if(K.dn.test(x))vol-=15;else return say(t('dunno'));vol=Math.max(0,Math.min(100,vol));muted=false;sv('nd_vol',vol);applyVol();return say(tf('vvol',vol))}
 if(KF.test(x)){if(KA.test(x)){if(!cur)return say(t('dunno'));if(!isFav(cur))toggleFav(cur);return say(t('ok'))}const l=favList().filter(i=>i.url&&usable(i.url));if(!l.length)return say(tf('vnf',t('fav')));playItem(l[0],l);return say(tf('vplay',l[0].name))}
 if(KH.test(x)&&RC[lc]){await setRg(RC[lc]);view='home';sv('nd_view',view);render();return say(t('ok'))}
 if(K.radio.test(x))return radioCmd(RC[lc]);
 if(K.lang.test(x)&&lc)return setLang(lc);
 if(K.pause.test(x)){want=false;audio.pause();return say(t('paused'))}

 if(K.next.test(x)){step(1);return say(t('ok'))}if(K.prev.test(x)){step(-1);return say(t('ok'))}
 const pl=K.play.test(x),sr=K.search.test(x),sw=x.search(new RegExp(SWS,'i'))>=0;

 say(t('dunno'))}

<script>
/* ===== Desktop shortcuts + mobile swipe gestures (no change to app logic) ===== */
(()=>{
 const $=id=>document.getElementById(id),typing=e=>/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
 const tip=(id,t)=>{const e=$(id);e&&!e.title&&(e.title=t)};
 tip('play','Play / Pause (Space)');tip('next','Next (N)');tip('prev','Previous (P)');tip('sPlay','Play / Pause (Space)');
 document.addEventListener('keydown',e=>{
  if(typing(e)||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(k===' '||k==='k'){e.preventDefault();$('play')?.click()}
  else if(k==='n'){$('next')?.click()}
  else if(k==='p'){$('prev')?.click()}
  else if(k==='/'){const s=$('search');if(s){e.preventDefault();s.focus()}}
 });
 /* swipe: mini player left/right = next/prev; sheet down = close */
 let x0,y0;
 const bind=(el,end)=>{if(!el)return;
  el.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  el.addEventListener('touchend',e=>{const t=e.changedTouches[0];end(t.clientX-x0,t.clientY-y0)},{passive:true})};
 bind($('mini'),(dx,dy)=>{if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5)(dx<0?$('next'):$('prev'))?.click();else if(dy<-50&&Math.abs(dy)>Math.abs(dx))$('open')?.click()});
 const sh=$('sheet');bind(sh,(dx,dy)=>{if(dy>110&&Math.abs(dy)>Math.abs(dx)*1.5&&sh.scrollTop<=0)$('close')?.click()});
 /* skip link for keyboard users */
 const m=$('main');if(m){m.setAttribute('tabindex','-1');const a=document.createElement('a');a.className='skip';a.href='#main';a.textContent='Skip to content';document.body.prepend(a)}
})();
</script>

<script>
/* ===== NAADAM advanced: aurora, 3D tilt, reveal, ripple, volume, accents, command palette ===== */
(()=>{
 const $=id=>document.getElementById(id),root=document.documentElement,A=$('audio');
 const st={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
 const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
 const au=document.createElement('div');au.id='aurora';au.innerHTML='<i></i><i></i><i></i>';document.body.prepend(au);
 const ps=()=>document.body.classList.toggle('playing-now',!A.paused&&!A.ended);
 ['play','playing','pause','ended','emptied'].forEach(e=>A.addEventListener(e,ps));
 /* HUD */
 const hudEl=document.createElement('div');hudEl.id='hud';document.body.append(hudEl);let ht;
 const hud=(t,p)=>{hudEl.innerHTML='<span></span>'+(p==null?'':'<b><i style="width:'+Math.round(p*100)+'%"></i></b>');hudEl.firstChild.textContent=t;hudEl.classList.add('show');clearTimeout(ht);ht=setTimeout(()=>hudEl.classList.remove('show'),1400)};
 /* volume */
 const vol=d=>{const sl=$('vol');sl.value=Math.min(100,Math.max(0,Math.round(+sl.value+d*100)));sl.dispatchEvent(new Event('input',{bubbles:true}));hud('🔊 Volume',sl.value/100)};
  const mute=()=>{$('vIc').click();hud(A.muted?'🔇 Muted':'🔊 Volume',A.muted?0:A.volume)};
 /* accent colours */
 const ACC={Sunset:1,Kerala:1,Ocean:1,Mint:1,Violet:1,Rose:1},names=Object.keys(ACC);
  const setAcc=n=>{if(!ACC[n])n='Sunset';root.dataset.pal=n.toLowerCase();st.set('nd-acc',n);document.querySelectorAll('#pal [data-p]').forEach(b=>b.classList.toggle('on',b.dataset.p===n));const m=document.getElementById('themeColor');if(m)m.content=getComputedStyle(root).getPropertyValue('--bg').trim()||'#0a0714'};
  const cycle=()=>{const n=names[(names.indexOf(st.get('nd-acc')||'Sunset')+1)%names.length];setAcc(n);hud('🎨 '+n)};
  const pw=document.createElement('div');pw.id='pal';pw.innerHTML='<div class="palb" role="dialog" aria-label="Colour palette"><h3>🎨 Colour palette</h3><div class="palg">'+names.map(n=>'<button data-p="'+n+'"><i></i>'+n+'</button>').join('')+'</div></div>';document.body.append(pw);
  function openPal(){pw.classList.add('show')}
  pw.addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(b){setAcc(b.dataset.p);hud('🎨 '+b.dataset.p);pw.classList.remove('show')}else if(e.target===pw)pw.classList.remove('show')});
  setAcc(st.get('nd-acc')||'Sunset');
 /* header buttons */
 const th=$('theme');if(th){const a=document.createElement('button');a.className='ib';a.textContent='🎨';a.title='Change accent colour';a.setAttribute('aria-label','Accent colour');a.onclick=openPal;
  const k=document.createElement('button');k.className='ib text-xs font-bold';k.textContent='⌘K';k.title='Command palette (Ctrl/⌘ + K)';k.setAttribute('aria-label','Command palette');k.onclick=()=>openCP();th.before(a,k)}
 /* command palette */
 const cp=document.createElement('div');cp.id='cp';cp.innerHTML='<div class="cpb" role="dialog" aria-label="Command palette"><input id="cpi" placeholder="Type a command…  ↑ ↓ Enter · Esc" autocomplete="off"><ul id="cpl"></ul></div>';document.body.append(cp);
 const click=q=>()=>document.querySelector(q)?.click();
 const cmds=()=>[...[...document.querySelectorAll('nav.bottom button[data-v]')].map(b=>({t:'Go to '+(b.getAttribute('aria-label')||b.dataset.v),f:()=>b.click()})),
  {t:'Voice assistant',f:click('[data-va]')},{t:'Play / Pause',f:click('#play')},{t:'Next',f:click('#next')},{t:'Previous',f:click('#prev')},{t:'Open Now Playing',f:click('#open')},
  {t:'Search',f:()=>{const s=$('search');if(s)s.focus();else{document.querySelector('nav.bottom button[data-v=radio]')?.click();setTimeout(()=>$('search')?.focus(),300)}}},
  {t:'Toggle dark / light',f:click('#theme')},{t:'Change language',f:click('#lang')},{t:'Next accent colour',f:cycle},{t:'Volume up',f:()=>vol(.1)},{t:'Volume down',f:()=>vol(-.1)},{t:'Mute / Unmute',f:mute},{t:'Colour palette',f:openPal},{t:'Focus timer',f:()=>window.NAADAM&&NAADAM.focus()},{t:'Keyboard shortcuts',f:()=>window.NAADAM&&NAADAM.help()},{t:'Switch view: Mobile / System',f:click('[aria-label="Switch view"]')}];
 let list=[],ix=0;
 const draw=()=>{const q=$('cpi').value.toLowerCase();list=cmds().filter(c=>c.t.toLowerCase().includes(q));ix=Math.min(ix,Math.max(0,list.length-1));
  $('cpl').innerHTML=list.map((c,i)=>'<li class="'+(i===ix?'on':'')+'" data-i="'+i+'">'+c.t+'</li>').join('')||'<li>No match</li>'};
 const closeCP=()=>cp.classList.remove('show');
 const run=i=>{const c=list[i];if(c){closeCP();setTimeout(c.f,50)}};
 function openCP(){cp.classList.add('show');$('cpi').value='';ix=0;draw();$('cpi').focus()}
 $('cpi').addEventListener('input',()=>{ix=0;draw()});
 $('cpl').addEventListener('click',e=>{const l=e.target.closest('li[data-i]');l&&run(+l.dataset.i)});
 cp.addEventListener('click',e=>{if(e.target===cp)closeCP()});
 $('cpi').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();ix=(ix+1)%list.length;draw()}else if(e.key==='ArrowUp'){e.preventDefault();ix=(ix-1+list.length)%list.length;draw()}else if(e.key==='Enter'){run(ix)}else if(e.key==='Escape'){closeCP()}});
 document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();cp.classList.contains('show')?closeCP():openCP();return}
  if(e.target.matches&&e.target.matches('input,textarea,select')||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='ArrowUp'){e.preventDefault();vol(.1)}else if(e.key==='ArrowDown'){e.preventDefault();vol(-.1)}else if(e.key.toLowerCase()==='m')mute();
 });
 /* ripple */
 document.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('.btn,.ib,.pbtn,.pill');if(!b||reduce)return;const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,s=document.createElement('span');s.className='rip';s.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(e.clientX-r.left-d/2)+'px;top:'+(e.clientY-r.top-d/2)+'px';b.append(s);setTimeout(()=>s.remove(),600)});
 /* 3D tilt (mouse devices) */
 if(matchMedia('(hover:hover)').matches&&!reduce){let el=null;
  document.addEventListener('pointermove',e=>{const t=e.target.closest&&e.target.closest('.hero,.mood,.tile .art');
   if(el&&el!==t){el.style.transform='';el=null}if(!t)return;el=t;
   const r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height,k=t.classList.contains('hero')?6:14;
   t.style.transform='perspective(800px) rotateY('+((x-.5)*k)+'deg) rotateX('+(-(y-.5)*k)+'deg) translateZ(10px)';
   t.style.setProperty('--mx',x*100+'%');t.style.setProperty('--my',y*100+'%')});
  document.addEventListener('pointerleave',()=>{el&&(el.style.transform='');el=null},true)}
 /* scroll reveal */
 const m=$('main');
 if(m&&'IntersectionObserver' in window&&!reduce){const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.05});
  const scan=()=>m.querySelectorAll('.sec:not(.rv),.hs:not(.rv)').forEach(n=>{n.classList.add('rv');io.observe(n)});
  new MutationObserver(scan).observe(m,{childList:true});scan()}
})();
</script>
